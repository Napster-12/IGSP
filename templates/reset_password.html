<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password | IGSP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/icebolethu.css') }}">
</head>
<body class="auth-body">
    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-brand">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="IGSP logo">
            </div>

            <h1>Choose a New Password</h1>
            <p class="auth-lead">Your new password must be at least 8 characters and include a number and a special character.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="flash-message flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form class="igsp-form auth-form" method="post" action="{{ url_for('reset_password', token=token) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label for="password">New Password</label>
                <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>

                <label for="confirm_password">Confirm New Password</label>
                <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="8" required>

                <button type="submit">Reset Password</button>
            </form>

            <p class="auth-footer-text"><a href="{{ url_for('login') }}">Back to login</a></p>
        </div>
    </div>
</body>
</html>
