<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{{ subject }}</title>
    <style>
        /* Styles are inlined below because most mail clients ignore <style>; these only add mobile tweaks. */
        @media (max-width: 620px) {
            .email-outer { padding: 16px 8px !important; }
            .email-pad { padding-left: 22px !important; padding-right: 22px !important; }
            .email-title { font-size: 22px !important; }
        }
    </style>
</head>
<body style="margin:0; padding:0; background-color:#F7F6F6; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color:#1F2430; -webkit-font-smoothing:antialiased;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F7F6F6;">
        <tr>
            <td class="email-outer" align="center" style="padding:32px 16px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px; background-color:#ffffff; border:1px solid #E6E3E3; border-radius:14px; overflow:hidden;">
                    <!-- Brand strip, same orange as the portal buttons -->
                    <tr>
                        <td style="height:6px; line-height:6px; font-size:0; background-color:#DD7A2D;">&nbsp;</td>
                    </tr>

                    <!-- Logo: on white so the orange in it stays visible -->
                    <tr>
                        <td class="email-pad" align="center" style="padding:32px 40px 8px;">
                            <img src="{{ logo_url }}" alt="Icebolethu Group" width="170" style="display:block; width:170px; max-width:60%; height:auto; margin:0 auto; border:0; outline:none; text-decoration:none;">
                        </td>
                    </tr>

                    <tr>
                        <td class="email-pad" align="center" style="padding:16px 40px 0;">
                            <h1 class="email-title" style="margin:0; font-size:26px; line-height:1.25; font-weight:700; color:#1F2430;">{{ subject }}</h1>
                        </td>
                    </tr>

                    <tr>
                        <td class="email-pad" style="padding:20px 40px 0;">
                            <div style="height:1px; line-height:1px; font-size:0; background-color:#E3E4E6;">&nbsp;</div>
                        </td>
                    </tr>

                    <tr>
                        <td class="email-pad" style="padding:24px 40px 32px; font-size:15px; line-height:1.6; color:#1F2430;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>

                    <!-- Contact footer, matching the sign-in pages -->
                    <tr>
                        <td class="email-pad" align="center" style="background-color:#000000; padding:18px 40px; font-size:13px; line-height:1.7; color:#EF4444;">
                            <strong>Call Centre:</strong> 031 208 9102<br>
                            <strong>Email:</strong> <a href="mailto:supplier_onboarding@icebolethu.co.za" style="color:#EF4444; text-decoration:none;">supplier_onboarding@icebolethu.co.za</a>
                        </td>
                    </tr>
                </table>

                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;">
                    <tr>
                        <td align="center" style="padding:16px 24px 0; font-size:12px; line-height:1.5; color:#6E696A;">
                            This email was sent automatically by the Icebolethu Group Supplier Portal. Please do not reply directly.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
