<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>{{ subject }}</title>
    <!--[if mso]>
    <noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
    <style>table, td, p, a, span, h1 { font-family: Arial, sans-serif !important; }</style>
    <![endif]-->
    <style>
        /* Most styles are inline because many mail clients drop <style>; these only tune small screens. */
        body { margin: 0 !important; padding: 0 !important; width: 100% !important; }
        table { border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; }
        a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; }
        @media screen and (max-width: 600px) {
            .email-outer { padding: 0 !important; }
            .email-card { border-radius: 0 !important; border-left: 0 !important; border-right: 0 !important; }
            .email-pad { padding-left: 20px !important; padding-right: 20px !important; }
            .email-title { font-size: 20px !important; line-height: 26px !important; }
            .email-button a { display: block !important; text-align: center !important; }
            .email-button { width: 100% !important; }
        }
    </style>
</head>
<body style="margin:0; padding:0; width:100%; background-color:#F7F6F6; -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#F7F6F6" style="width:100%; background-color:#F7F6F6;">
        <tr>
            <td class="email-outer" align="center" style="padding:24px 12px;">
                <!--[if mso]><table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" align="center"><tr><td><![endif]-->
                <table role="presentation" class="email-card" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff"
                       style="width:100%; max-width:560px; margin:0 auto; background-color:#ffffff; border:1px solid #E6E3E3; border-radius:12px;">
                    <tr>
                        <td height="4" bgcolor="#DD7A2D" style="height:4px; line-height:4px; font-size:4px; background-color:#DD7A2D; border-radius:12px 12px 0 0;">&nbsp;</td>
                    </tr>
                    <tr>
                        <td class="email-pad" style="padding:24px 32px 0 32px;">
                            <img src="{{ logo_url }}" alt="Icebolethu Group" width="120" height="47" style="display:block; width:120px; height:47px; border:0; outline:none; text-decoration:none;">
                        </td>
                    </tr>
                    <tr>
                        <td class="email-pad" style="padding:20px 32px 0 32px;">
                            <h1 class="email-title" style="margin:0; font-family:'Segoe UI', Arial, sans-serif; font-size:22px; line-height:28px; font-weight:bold; color:#1F2430; mso-line-height-rule:exactly;">{{ subject }}</h1>
                        </td>
                    </tr>
                    <tr>
                        <td class="email-pad" style="padding:16px 32px 28px 32px; font-family:'Segoe UI', Arial, sans-serif; font-size:15px; line-height:24px; color:#1F2430; mso-line-height-rule:exactly; word-break:break-word;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>
                    <tr>
                        <td class="email-pad" bgcolor="#F7F6F6" style="padding:16px 32px; background-color:#F7F6F6; border-top:1px solid #E6E3E3; border-radius:0 0 12px 12px; font-family:'Segoe UI', Arial, sans-serif; font-size:13px; line-height:20px; color:#5B5F66; mso-line-height-rule:exactly; word-break:break-word;">
                            Questions? Call <a href="tel:+27312089102" style="color:#B4560C; text-decoration:none; font-weight:bold;">031&nbsp;208&nbsp;9102</a>
                            or email <a href="mailto:supplier_onboarding@icebolethu.co.za" style="color:#B4560C; text-decoration:none; font-weight:bold;">supplier_onboarding@icebolethu.co.za</a>
                        </td>
                    </tr>
                </table>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:560px; margin:0 auto;">
                    <tr>
                        <td align="center" class="email-pad" style="padding:12px 20px 0; font-family:'Segoe UI', Arial, sans-serif; font-size:11px; line-height:16px; color:#8A8E95;">
                            Icebolethu Group Supplier Portal · Automated email, please don't reply.
                        </td>
                    </tr>
                </table>
                <!--[if mso]></td></tr></table><![endif]-->
            </td>
        </tr>
    </table>
</body>
</html>
