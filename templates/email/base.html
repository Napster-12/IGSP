<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{{ subject }}</title>
    <style>
        /* Styles are inlined below because most mail clients ignore <style>; these only add mobile tweaks. */
        @media (max-width: 620px) {
            .email-outer { padding: 12px 8px !important; }
            .email-pad { padding-left: 20px !important; padding-right: 20px !important; }
            .email-title { font-size: 20px !important; }
        }
    </style>
</head>
<body style="margin:0; padding:0; background-color:#F7F6F6; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color:#1F2430; -webkit-font-smoothing:antialiased;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F7F6F6;">
        <tr>
            <td class="email-outer" align="center" style="padding:28px 16px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px; background-color:#ffffff; border:1px solid #E6E3E3; border-radius:12px; overflow:hidden;">
                    <tr>
                        <td style="height:4px; line-height:4px; font-size:0; background-color:#DD7A2D;">&nbsp;</td>
                    </tr>
                    <tr>
                        <td class="email-pad" style="padding:24px 36px 0;">
                            <img src="{{ logo_url }}" alt="Icebolethu Group" width="120" style="display:block; width:120px; height:auto; border:0; outline:none; text-decoration:none;">
                        </td>
                    </tr>
                    <tr>
                        <td class="email-pad" style="padding:20px 36px 0;">
                            <h1 class="email-title" style="margin:0; font-size:22px; line-height:1.3; font-weight:700; color:#1F2430;">{{ subject }}</h1>
                        </td>
                    </tr>
                    <tr>
                        <td class="email-pad" style="padding:16px 36px 28px; font-size:15px; line-height:1.6; color:#1F2430;">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>
                    <tr>
                        <td class="email-pad" style="padding:16px 36px; background-color:#F7F6F6; border-top:1px solid #E6E3E3; font-size:13px; line-height:1.6; color:#5B5F66;">
                            Questions? Call <a href="tel:0312089102" style="color:#B4560C; text-decoration:none; font-weight:600;">031 208 9102</a>
                            or email <a href="mailto:supplier_onboarding@icebolethu.co.za" style="color:#B4560C; text-decoration:none; font-weight:600;">supplier_onboarding@icebolethu.co.za</a>
                        </td>
                    </tr>
                </table>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
                    <tr>
                        <td align="center" style="padding:12px 24px 0; font-size:11px; line-height:1.5; color:#8A8E95;">
                            Icebolethu Group Supplier Portal · Automated email, please don't reply.
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
