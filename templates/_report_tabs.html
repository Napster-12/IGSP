{#- Report switcher shown at the top of every report. Expects `report_kinds` and `kind`. -#}
<nav class="ig-report-tabs" aria-label="Choose a report">
    {% for key, label in report_kinds %}
        <a href="{{ url_for('admin_reports') if key == 'applications' else url_for('admin_report', kind=key, **(range_args if range_args is defined else {})) }}"
           class="ig-report-tab{% if key == kind %} is-active{% endif %}" {% if key == kind %}aria-current="page"{% endif %}>{{ label }}</a>
    {% endfor %}
</nav>
