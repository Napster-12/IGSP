<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password | IGSP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/icebolethu.css') }}">
</head>
<body class="auth-body">
    <div class="auth-shell">
        <div class="auth-card">
            <div class="auth-brand">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="IGSP logo">
            </div>

            <h1>Forgot Password</h1>
            <p class="auth-lead">Enter the email address you registered with and we'll send you a link to reset your password.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="flash-message flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form class="igsp-form auth-form" method="post" action="{{ url_for('forgot_password') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label for="email">Email Address</label>
                <input id="email" name="email" type="email" placeholder="name@company.co.za" autocomplete="email" required>

                <button type="submit">Send Reset Link</button>
            </form>

            <p class="auth-footer-text">Remembered it? <a href="{{ url_for('login') }}">Back to login</a></p>
        </div>
    </div>
</body>
</html>
